name: Build MCLauncher

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore MCLauncher.sln

      - name: Build MCLauncher (C#)
        run: msbuild MCLauncher/MCLauncher.csproj /p:Configuration=Release /p:Platform="Any CPU" /nologo

      - name: Build GDKLaunchShim (C++)
        run: msbuild GDKLaunchShim/GDKLaunchShim.vcxproj /p:Configuration=Release /p:Platform=x64 /nologo

      - name: Build GDKDecryptHelper (C++)
        run: msbuild GDKDecryptHelper/GDKDecryptHelper.vcxproj /p:Configuration=Release /p:Platform=x64 /nologo

      - name: Build WUTokenHelper (C++)
        run: msbuild WUTokenHelper/WUTokenHelper.vcxproj /p:Configuration=Release /p:Platform=x64 /nologo

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts
          Copy-Item "MCLauncher/bin/Release/*"                               artifacts/ -Recurse -ErrorAction SilentlyContinue
          Copy-Item "GDKLaunchShim/x64/Release/GDKLaunchShim.exe"           artifacts/ -ErrorAction SilentlyContinue
          Copy-Item "GDKDecryptHelper/x64/Release/GDKDecryptHelper.exe"     artifacts/ -ErrorAction SilentlyContinue
          Copy-Item "WUTokenHelper/x64/Release/WUTokenHelper.exe"           artifacts/ -ErrorAction SilentlyContinue

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MCLauncher-Release
          path: artifacts/
